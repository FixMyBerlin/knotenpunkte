# One Netlify site (radnetz-apps.netlify.app) serves every app from its own folder of `dist`.
# New app: add `build:<name>` in package.json, give its vite.config.ts `outDir: dist/<name>` and
# `base: /<name>/` for production, add one redirect block below and a link in `home/index.html`.
# `/` is the overview page `home/index.html` (copied by `build:home`).

[build]
command = "bun install --frozen-lockfile && bun run build"
publish = "dist"

[build.environment]
# The build image installs Bun with mise, which needs a concrete version (a range like `1.x`
# fails with a 404). The repo needs Bun 1.3 or newer (`minimumReleaseAge` in bunfig.toml);
# keep this at the version used locally.
BUN_VERSION = "1.4.4"

# SPA fallback per app. A rewrite with status 200 only applies when no file matches, so assets
# and `osm-oauth-land.html` are served as files. Do not add `force = true`.
[[redirects]]
from = "/knotenpunkte/*"
to = "/knotenpunkte/index.html"
status = 200

[[redirects]]
from = "/netzanpassungen/*"
to = "/netzanpassungen/index.html"
status = 200

[[redirects]]
from = "/fortschritt/*"
to = "/fortschritt/index.html"
status = 200

# Fortschritt is for the team only: keep it out of search engines.
[[headers]]
for = "/fortschritt/*"
[headers.values]
X-Robots-Tag = "noindex"
